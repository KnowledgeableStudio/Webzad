<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting | Webzad</title>
    <script>
      (function(){var u=new URL(window.location.href);var p=u.pathname.replace(/\/+$/,'');var s=p.substring(p.lastIndexOf('/')+1);var t=new URL('./index.html',u);if(s&&s!=='404.html'){t.hash='#'+s;}window.location.replace(t.href);})();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050710;
        color: #f5f7fb;
        font: 500 16px/1.5 Manrope, system-ui, sans-serif;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <noscript>
      <p><a href="./index.html">Open Webzad</a></p>
    </noscript>
  </body>
</html>
